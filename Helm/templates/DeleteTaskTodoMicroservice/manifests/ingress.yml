apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-todo-delete-tasks-api-ingress
spec:
  ingressClassName: {{ .Values.common.ingressClassName }}
  rules:
    - host: {{ .Release.Name }}-tododeletetask.techno028.shop
      http:
        paths:
          - pathType: {{ .Values.deltask.pathType }}
            path: {{ .Values.deltask.path }}
            backend:
              service:
                name: {{ .Release.Name }}-todo-delete-tasks-api
                port:
                  number: {{ .Values.deltask.number }}
                  
